# (make capture-baselines-account_takeover) from gate outputs of a
# template that renders evidence by authority tier. Each case: the
# corpora and tiers of the passages the gate rendered, the corpus the
# verdict named as governing, and the documents it cites (the
# passages on point). The gate's eval reports the rate of verdicts
# naming a lower tier than a passage on point
# (policy_rag_gate/eval/authority.py). ATO binds one corpus at tier
# 1, so its cases cannot violate authority; they keep the metric's
# path exercised.

