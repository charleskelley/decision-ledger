<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 80 80" fill="none">
  <!-- Structure: converging -->
  <line x1="20" y1="10" x2="40" y2="33" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="60" y1="10" x2="40" y2="33" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <!-- Accent: decision bar -->
  <line x1="24" y1="40" x2="56" y2="40" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <!-- Accent: record bars (back layer) -->
  <line x1="26" y1="48" x2="54" y2="48" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <line x1="30" y1="54" x2="50" y2="54" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  <line x1="34" y1="60" x2="46" y2="60" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <line x1="37" y1="66" x2="43" y2="66" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3" />
  <!-- Structure: diverging (front layer) -->
  <line x1="40" y1="47" x2="20" y2="70" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="47" x2="60" y2="70" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
</svg>