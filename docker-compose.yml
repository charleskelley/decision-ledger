# Docker Compose V2 — no version key (deprecated; omit entirely for Compose V2)
#
# Brings up the framework-owned local stack for DecisionLedger:
#   PostgreSQL 16 + pgvector — shared vector store (dense retrieval) + audit
#                  store. All reasoners share the database; tenant separation
#                  is row-level via `reasoner_id`. The init scripts are the
#                  canonical DDL shipped in app/audit/sql/.
#   Elasticsearch 8 — shared BM25 sparse retrieval for the policy corpus.
#
# Reasoner-owned infrastructure lives in each reasoner's own compose file and
# is pulled in with `include:` (Compose >= 2.20):
#   reasoners/account_takeover/compose.yaml — Redis 7 (ATO feature windows,
#                  dedup store, login-event stream).
#
# M1 Max (ARM64) compatible: all images publish linux/arm64 manifests.
#
# Usage:
#   docker compose up -d        Start all services in background
#   docker compose down         Stop services (volumes preserved)
#   docker compose down -v      Full reset — removes all volumes

include:
  - reasoners/account_takeover/compose.yaml

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector — dense vector store + Decision Bundle audit store
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisionledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionledger}
      POSTGRES_DB: ${POSTGRES_DB:-decisionledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/audit/sql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./app/audit/sql/02_tables.sql:/docker-entrypoint-initdb.d/02_tables.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-decisionledger} -d ${POSTGRES_DB:-decisionledger}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Elasticsearch 8 — BM25 sparse retrieval for policy corpus
  # Security disabled for local dev only. Never expose to public network.
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  es_data:
