# Member-local Ruff config: inherits everything from the root pyproject and
# only adds the MCP package's first-party name and per-file ignores.
extend = "../../pyproject.toml"
src = ["src", "tests", "../.."]

[lint.isort]
known-first-party = ["core", "app", "eval", "decisionledger_mcp"]

[lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "D",      # no docstring requirements in tests
    "S101",   # assert is expected in tests
    "S105",   # test keys are fine
    "S106",   # test keys are fine
]
