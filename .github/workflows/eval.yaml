name: Eval

# Every eval against the live stack: the framework harness for each matrix
# reasoner (consistency, robustness, shadow) and each matrix gate's own
# harness (the policy_rag gate: retrieval, faithfulness, citation). Manual
# trigger only — cost-bounded by definition; re-enable a cron once the
# harness is stable and budget is approved.
#
# Uses an `eval` GitHub Actions environment so secrets and budget can be
# scoped separately from CI/integration. Configure required reviewers on
# the environment if you want manual triggers to require approval.
# See docs/operations/secrets.md for full operator guidance.

on:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: Eval harnesses (${{ matrix.reasoner }}, ${{ matrix.gate }})
    runs-on: ubuntu-latest
    environment: eval
    timeout-minutes: 30

    # One job per (reasoner, gate) pair of workspace members. The framework
    # harness runs with the reasoner's eval adapter; the gate's harness runs
    # against that same reasoner's datasets (REASONER=<reasoner_id>), the only
    # corpus the job indexes. `include` maps each reasoner directory to its
    # reasoner_id.
    strategy:
      fail-fast: false
      matrix:
        reasoner: [account_takeover]
        gate: [policy_rag]
        include:
          - reasoner: account_takeover
            reasoner_id: ato-reasoner

    services:
      # Reasoner infrastructure (mirrors reasoners/account_takeover/compose.yaml).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      # The pgvector image ships the vector extension the policy_rag gate's
      # DDL creates.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decisionledger
          POSTGRES_PASSWORD: decisionledger
          POSTGRES_DB: decisionledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decisionledger -d decisionledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Gate infrastructure (mirrors gates/policy_rag/compose.yaml).
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: decisionledger
      POSTGRES_PASSWORD: decisionledger
      POSTGRES_DB: decisionledger
      ATO_REDIS_URL: redis://localhost:6379
      POLICY_RAG_GATE_ELASTICSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Initialize Postgres schema
        env:
          PGPASSWORD: decisionledger
        run: |
          psql -h localhost -U decisionledger -d decisionledger \
            -f app/audit/sql/01_init.sql
          psql -h localhost -U decisionledger -d decisionledger \
            -f app/audit/sql/02_tables.sql

      - name: Prepare gate (own schema)
        id: prepare_gate
        run: make prepare-gate-${{ matrix.gate }}

      # Index the reasoner's policy corpus and train its model if missing
      # (reasoners/<name>/reasoner.mk).
      - name: Prepare reasoner (policy index + model)
        id: prepare_reasoner
        run: make prepare-${{ matrix.reasoner }}

      # Framework harness: outputs/stage/eval/reasoner/<reasoner_id>/.
      - name: Run reasoner eval harness
        run: make eval-${{ matrix.reasoner }}

      # Gate harness: outputs/stage/eval/gate/<gate_id>/<reasoner_id>/.
      # Runs even when the reasoner harness failed, so both reports land, but
      # never after setup or preparation failed: it makes paid LLM calls.
      - name: Run gate eval harness
        if: ${{ !cancelled() && steps.prepare_gate.outcome == 'success' && steps.prepare_reasoner.outcome == 'success' }}
        run: make eval-gate-${{ matrix.gate }} REASONER=${{ matrix.reasoner_id }}

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ matrix.reasoner }}-${{ matrix.gate }}-${{ github.run_id }}
          path: outputs/stage/eval/
          if-no-files-found: warn
          retention-days: 30
