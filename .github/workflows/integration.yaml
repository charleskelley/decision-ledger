name: Integration

# Integration + smoke tests against live Postgres (the framework's only
# infrastructure) plus each matrix gate's and reasoner's own infrastructure
# (Elasticsearch and the vector extension for the policy_rag gate, Redis for
# account_takeover). Trunk-based development: also runs on direct push to
# main so solo trunk pushes are validated even without a PR cycle.
# OpenAI spend stays bounded because most account_takeover scenarios are
# recorded under its registered bypass rules (allow-band, block-band); only
# gate-mode decisions call the policy_rag gate's LLM.
# Target: under 5 minutes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration + smoke (${{ matrix.reasoner }}, ${{ matrix.gate }})
    # Fork PRs cannot see repository secrets (OPENAI/ANTHROPIC keys), so the
    # suite would fail spuriously — maintainers run it before merge instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # One job per (reasoner, gate) pair of workspace members that bring
    # infrastructure (reasoners/<name>, gates/<name>); example and rules bring
    # none and have no integration tests. The reference-pattern mocks (DR-35)
    # bring none either and get no entry: the stream mock's integration test
    # runs in this job, on the shared infrastructure. Each entry runs the
    # whole integration suite; fine while there is one entry.
    strategy:
      fail-fast: false
      matrix:
        reasoner: [account_takeover]
        gate: [policy_rag]

    services:
      # Reasoner infrastructure (mirrors reasoners/account_takeover/compose.yaml).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      # The pgvector image ships the vector extension the policy_rag gate's
      # DDL creates; the framework's DDL creates none.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decisionledger
          POSTGRES_PASSWORD: decisionledger
          POSTGRES_DB: decisionledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decisionledger -d decisionledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Gate infrastructure (mirrors gates/policy_rag/compose.yaml).
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: decisionledger
      POSTGRES_PASSWORD: decisionledger
      POSTGRES_DB: decisionledger
      ATO_REDIS_URL: redis://localhost:6379
      POLICY_RAG_GATE_ELASTICSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      # Service containers don't support volume mounts for init scripts the
      # way docker-compose does, so apply Postgres init SQL explicitly.
      - name: Initialize Postgres schema (framework tables)
        env:
          PGPASSWORD: decisionledger
        run: |
          psql -h localhost -U decisionledger -d decisionledger \
            -f app/audit/sql/01_init.sql
          psql -h localhost -U decisionledger -d decisionledger \
            -f app/audit/sql/02_tables.sql

      # The gate's own schema (gates/<name>/gate.mk).
      - name: Prepare gate (own schema)
        run: make prepare-gate-${{ matrix.gate }}

      # Index every installed reasoner's policy corpus and train any missing
      # model (each reasoners/<name>/reasoner.mk joins prepare-reasoners), not
      # only the matrix reasoner's: the stream mock's integration test
      # registers it over HTTP with a binding that names mock-stream-practices,
      # and the RAG policy gate admits a binding only to a loaded corpus (so
      # does every ledger that composes the installed plugins by default).
      - name: Prepare reasoners (every policy index + missing models)
        run: make prepare-reasoners

      - name: Integration tests
        run: make test-integration

      - name: Smoke tests
        run: make test-smoke
