# Faithfulness golden outputs.
#
# Hand-crafted seed fixtures whose rationales paraphrase the cited
# context text closely. Each rationale's claims are directly verifiable
# from the contexts — RAGAS' atomic-claim decomposition + verification
# should mark every claim as supported.
#
# These will be replaced over time by live captures from
# tools/capture_baselines.py as polish §6 (calibration notebook)
# tightens scorer routing for more scenarios. The capture script is
# additive: re-running it merges captures into this dataset by case_id
# rather than overwriting (see tools/capture_baselines.py:_merge_cases).
#
# Schema (from eval/dimensions/faithfulness.py):
#   case_id          — stable identifier
#   rationale        — gate's natural-language justification
#   contexts         — full retrieved snippet text list (the haystack)
#   cited_snippets   — subset of contexts the rationale grounds in

cases:
  - case_id: f01-stepup-aal2
    rationale: >
      The session originates from a device or context not previously
      associated with the subscriber. The verifier shall re-bind the
      authenticator through a step-up process at AAL2 or higher prior
      to granting access. The decision is to CHALLENGE.
    contexts:
      - >
        When a verifier observes a session originating from a device or
        context not previously associated with the subscriber, the
        verifier SHALL re-bind the authenticator through a step-up
        process at AAL2 or higher prior to granting access.
    cited_snippets:
      - >
        When a verifier observes a session originating from a device or
        context not previously associated with the subscriber, the
        verifier SHALL re-bind the authenticator through a step-up
        process at AAL2 or higher prior to granting access.

  - case_id: f02-impossible-travel-block
    rationale: >
      The authentication attempt's source geolocation is incompatible
      with the subject's prior session location given the elapsed
      time, with an apparent velocity above 1000 km/h. This must be
      treated as an impossible-travel event, and the pipeline shall
      block the session. The decision is to BLOCK.
    contexts:
      - >
        Authentication attempts whose source geolocation is incompatible
        with the subject's prior session location given the elapsed time
        (commonly >1000 km/h apparent velocity) must be treated as
        impossible-travel events. The pipeline SHALL block the session.
    cited_snippets:
      - >
        Authentication attempts whose source geolocation is incompatible
        with the subject's prior session location given the elapsed time
        (commonly >1000 km/h apparent velocity) must be treated as
        impossible-travel events. The pipeline SHALL block the session.

  - case_id: f03-velocity-rate-limit
    rationale: >
      The rolling 60-minute authentication count for this account
      exceeds the configured threshold. The system applies progressive
      rate-limiting controls and routes subsequent attempts through
      CHALLENGE or HOLD pending review. The decision is to CHALLENGE.
    contexts:
      - >
        When the rolling 60-minute authentication count for an account
        exceeds the configured threshold, the system applies
        progressive rate-limiting controls and routes subsequent
        attempts through CHALLENGE or HOLD pending review.
    cited_snippets:
      - >
        When the rolling 60-minute authentication count for an account
        exceeds the configured threshold, the system applies
        progressive rate-limiting controls and routes subsequent
        attempts through CHALLENGE or HOLD pending review.

  - case_id: f04-novel-entity-hold
    rationale: >
      The account was created within the prior 7 days and has fewer
      than 5 prior successful authentications, so it is subject to
      enhanced scrutiny. Suspicious authentication patterns from such
      accounts route to HOLD with an analyst review packet rather than
      to ALLOW or BLOCK. The decision is to HOLD.
    contexts:
      - >
        Accounts created within the prior 7 days, or with fewer than 5
        prior successful authentications, are subject to enhanced
        scrutiny. Suspicious authentication patterns from these
        accounts route to HOLD with an analyst review packet rather
        than to ALLOW or BLOCK.
    cited_snippets:
      - >
        Accounts created within the prior 7 days, or with fewer than 5
        prior successful authentications, are subject to enhanced
        scrutiny. Suspicious authentication patterns from these
        accounts route to HOLD with an analyst review packet rather
        than to ALLOW or BLOCK.

  - case_id: f05-passkey-allow
    rationale: >
      The session is authenticated via a FIDO2/WebAuthn passkey, which
      is a phishing-resistant authenticator bound to a hardware
      authenticator or device biometric. A successful passkey
      assertion satisfies AAL2 without an additional second-factor
      challenge. The decision is to ALLOW.
    contexts:
      - >
        FIDO2/WebAuthn passkey credentials are phishing-resistant
        authenticators bound to a hardware authenticator or device
        biometric. A successful passkey assertion satisfies AAL2
        without an additional second-factor challenge.
    cited_snippets:
      - >
        FIDO2/WebAuthn passkey credentials are phishing-resistant
        authenticators bound to a hardware authenticator or device
        biometric. A successful passkey assertion satisfies AAL2
        without an additional second-factor challenge.

  - case_id: f06-jurisdiction-conflict-hold
    rationale: >
      Two policies governing this authentication event impose
      conflicting requirements on log retention. The gate emits a
      jurisdiction-conflict signal and routes the decision to HOLD.
      The decision is to HOLD.
    contexts:
      - >
        When two policies governing the same authentication event
        impose conflicting requirements, the gate emits a
        jurisdiction-conflict signal and routes the decision to HOLD.
    cited_snippets:
      - >
        When two policies governing the same authentication event
        impose conflicting requirements, the gate emits a
        jurisdiction-conflict signal and routes the decision to HOLD.

  - case_id: f07-hva-mandatory-passkey
    rationale: >
      The account is classified as a high-value account (HVA), which
      is subject to elevated authentication requirements.
      Password-only authentication is not permitted; HVA sessions
      require passkey assertion or hardware-token MFA. The current
      attempt uses a password credential, so the decision is to
      CHALLENGE for passkey enrollment before granting access.
    contexts:
      - >
        High-value accounts (HVA) are subject to elevated
        authentication requirements. Password-only authentication is
        not permitted; HVA sessions require passkey assertion or
        hardware-token MFA.
    cited_snippets:
      - >
        High-value accounts (HVA) are subject to elevated
        authentication requirements. Password-only authentication is
        not permitted; HVA sessions require passkey assertion or
        hardware-token MFA.

  - case_id: f08-credential-stuffing-block
    rationale: >
      Multiple sub-second authentication attempts have been observed
      across accounts originating from the same source ASN, matching
      the credential-stuffing-burst pattern. ASN-scoped controls apply
      a temporary 15-minute block on authentication attempts
      originating from the source ASN. The decision is to BLOCK.
    contexts:
      - >
        Credential-stuffing-burst patterns are typified by sub-second
        repeat attempts across multiple accounts from the same source
        ASN; treat these as ASN-scoped controls in addition to
        per-account velocity.
      - >
        ASN-scoped controls apply a temporary 15-minute block on
        authentication attempts originating from the source ASN; the
        block is logged and reviewed by the security operations team.
    cited_snippets:
      - >
        Credential-stuffing-burst patterns are typified by sub-second
        repeat attempts across multiple accounts from the same source
        ASN; treat these as ASN-scoped controls in addition to
        per-account velocity.
      - >
        ASN-scoped controls apply a temporary 15-minute block on
        authentication attempts originating from the source ASN; the
        block is logged and reviewed by the security operations team.
