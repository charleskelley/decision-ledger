# Robustness sub-check 4 — Fallback behavior correctness.
#
# When an upstream dependency fails (LLM 5xx, retrieval-layer outage),
# the pipeline must degrade safely. The contract: every failure path
# lands on the conservative HOLD action. Failing open (returning ALLOW
# on dependency error) is the worst-case posture.
#
# Threshold: zero tolerance (1.00).
#
# fallback_kind values supported by PipelineDriver.run_with_forced_fallback:
#   - "llm_5xx"          — LLMClient.complete_structured raises; PolicyGate
#                          catches internally and emits verdict=None;
#                          enforcement Tier 1 routes to HOLD.
#   - "retrieval_error"  — PolicyRetriever.retrieve raises; the driver
#                          translates the raised error into HOLD per the
#                          fallback contract (production code is expected
#                          to grow an explicit catch over time).
#
# Both fault paths fire only when the gate (or retriever) is actually
# invoked, which requires the scorer to ROUTE_TO_GATE rather than
# fast-path. Each case primes 10 baseline events for the same account
# (sparse_history threshold is 10 — exactly 10 priming events makes
# total_events == 10 which clears the sparse flag) so the trigger can
# carry just enough novelty (new IP + new device, SAME geo) to score
# in the 0.20–0.95 routing band without overshooting into fast-path
# block.
#
# corpus_mismatch was dropped from this dataset: it ran the pipeline
# with a stale corpus_version label but never altered behavior, so the
# returned action was just whatever the gate happened to decide. That
# made the case non-deterministic. It will be re-introduced when the
# pipeline grows real corpus-version validation.

