[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "decision-ledger"
version = "0.1.0"
description = "A model-agnostic governed decision framework for AI systems."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Charles Kelley" },
]
keywords = [
    "ai-governance",
    "llm-evaluation",
    "rag",
    "decision-systems",
    "mlops",
    "policy-enforcement",
    "audit-trail",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# =============================================================================
# Dependencies
# =============================================================================

# The framework's only infrastructure is Postgres (DR-27). Search, embeddings,
# LLM SDKs, and eval scorers belong to the gates that use them (gates/*), and
# model/feature-store dependencies to the reasoners (reasoners/*).
dependencies = [
    # --- Core (schema, contracts, pure logic) ---
    "pydantic>=2.7,<3",
    # --- API layer ---
    "fastapi>=0.111,<1",
    # Imported directly for the problem handler of routing errors (404/405).
    "starlette>=0.40,<1",
    "uvicorn[standard]>=0.30,<1",
    # --- Ledger client (app.client.HttpClient) ---
    "httpx>=0.27,<1",
    # --- Database (audit ledger) ---
    "psycopg[binary]>=3.1,<4",
    # --- Serialization & config ---
    "pyyaml>=6.0,<7",
    "orjson>=3.10,<4",
    "pydantic-settings>=2.13.1",
    # --- Observability ---
    "structlog>=24.1,<25",
]

[dependency-groups]
dev = [
    # --- Testing ---
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-xdist>=3.5,<4",
    "pytest-timeout>=2.3,<3",
    # --- Linting & formatting ---
    "ruff>=0.5,<1",
    "sqlfluff>=3.1,<4",
    # --- Type checking ---
    "pyright>=1.1.370,<2",
    # --- Utilities ---
    "ipython>=8.25,<9",
    "rich>=13.7,<14",              # Pretty CLI output
    # Type stubs for the workspace's reasoner members (pyright checks
    # reasoners/*/src from this root environment). Also declared in the ATO
    # member's own dev group, which a bare root `uv sync` does not install.
    "pandas-stubs>=3.0.0.260204",
]
# Deployment composition: the reasoner plugins this checkout installs. The
# framework's own [project] dependencies never name a reasoner; this group is
# the pyproject analog of the compose `include:` (see docker-compose.yml).
reasoners = [
    "ato-reasoner",
    "example-reasoner",
]
# Deployment composition: the gate plugins this checkout installs (DR-28).
# The RAG policy gate comes with its `eval` extra (RAGAS) so its eval harness
# runs from a bare `uv sync`.
gates = [
    "decisionledger-gate-rules",
    "decisionledger-gate-policy-rag[eval]",
]
# Deployment composition: the clients of the ledger this checkout installs
# (the MCP server). They talk to the ledger through app.client only.
integrations = [
    "decisionledger-mcp",
]
docs = [
    # --- Documentation ---
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    # --- API reference (mkdocstrings, one page per top-level package) ---
    "mkdocstrings[python]>=0.27,<1",
    "griffe-pydantic>=1.0,<2",
    # mkdocstrings auto-formats rendered signatures with ruff if present.
    # Listed here so CI's --no-dev install still picks it up.
    "ruff>=0.5,<1",
]

[project.urls]
Repository = "https://github.com/charleskelley/decision-ledger"
Documentation = "https://charleskelley.github.io/decision-ledger/"
Issues = "https://github.com/charleskelley/decision-ledger/issues"

# =============================================================================
# uv workspace — reasoner plugins under reasoners/*, gate plugins under gates/*,
# ledger clients under integrations/*
# =============================================================================
# Reasoners declare their own `decisionledger.reasoners` and
# `decisionledger.eval_adapters` entry points, and gates their own
# `decisionledger.gates` entry point, in their member pyproject. Integrations
# publish no plugin: they are clients of the ledger.

[tool.uv]
default-groups = ["dev", "reasoners", "gates", "integrations"]

[tool.uv.workspace]
members = ["reasoners/*", "gates/*", "integrations/*"]

[tool.uv.sources]
ato-reasoner = { workspace = true }
example-reasoner = { workspace = true }
decisionledger-gate-rules = { workspace = true }
decisionledger-gate-policy-rag = { workspace = true }
decisionledger-mcp = { workspace = true }

# =============================================================================
# Hatch (build configuration)
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["core", "app", "eval"]

# =============================================================================
# Ruff — single tool for formatting and linting
# See STYLE.md for conventions. No black, no isort, no flake8, no pylint.
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["core", "app", "eval", "tests", "conformance"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "PIE",    # flake8-pie
]
ignore = [
    "D100",   # missing docstring in public module (too noisy early on)
    "D104",   # missing docstring in public package
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "S101",   # assert used (fine in tests)
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic models require runtime imports — do not move to TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"docs/**/*.py" = [
    "E501",   # PlantUML directive strings cannot be wrapped
]
"tests/**/*.py" = [
    "D",      # no docstring requirements in tests
    "S101",   # assert is expected in tests
    "S105",   # hardcoded passwords in test fixtures are fine
    "S106",   # hardcoded passwords in test fixtures are fine
]
"conformance/**/*.py" = [
    "D",      # no docstring requirements in tests
    "S101",   # assert is expected in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["core", "app", "eval"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

# =============================================================================
# Pyright — type checking
# =============================================================================

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# `reasoners/**/src`, not `reasoners/*/src`: pyright 1.1.408 silently matches
# nothing for a single-star directory glob. Member packages (ato_reasoner,
# rules_gate, policy_rag_gate) resolve via the editable install, so no
# extraPaths are needed.
include = [
    "core",
    "app",
    "eval",
    "reasoners/**/src",
    "gates/**/src",
    "integrations/**/src",
    "conformance",
]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = true

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests", "reasoners/*/tests", "gates/*/tests", "integrations/*/tests"]
# Repo root on sys.path so ``tests._stub_reasoner.plugin:PLUGIN`` resolves
# through ``importlib.metadata.EntryPoint.load()`` exactly like an installed
# plugin would.
pythonpath = ["."]
python_files = "test_*.py"
python_functions = "test_*"
addopts = [
    "-ra",                         # show summary of all non-passing tests
    "--strict-markers",            # fail on unknown markers
    "--strict-config",             # fail on config errors
    "-q",                          # quiet output by default
    "--import-mode=importlib",     # several test trees without basename clashes
]
markers = [
    "conformance: the HTTP contract suite, run against a live instance (make conformance)",
    "integration: requires Docker services (see docker-compose.yml)",
    "evaluation: full evaluation harness tests (slow, LLM calls, costs money)",
    "slow: tests that take >10s for reasons other than integration or eval",
    "smoke: minimal end-to-end sanity check (subset of integration, fast)",
]
filterwarnings = [
    "ignore::DeprecationWarning:sentence_transformers.*",
    "ignore::DeprecationWarning:torch.*",
]
asyncio_mode = "auto"

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["core", "app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "@overload",
]

# =============================================================================
# SQLFluff — SQL linting and formatting
# Dialect: postgres (matches docker-compose.yml PostgreSQL 16 service)
# =============================================================================

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
sql_file_exts = ".sql,.pgsql"
max_line_length = 88              # Consistent with ruff line-length

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"   # Consistent with app/audit/sql/*.sql style

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.types]
capitalisation_policy = "lower"
