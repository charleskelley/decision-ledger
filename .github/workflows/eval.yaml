name: Eval

# Full 5-dimension eval harness against the live stack. Manual trigger
# only — cost-bounded by definition; re-enable a cron once the harness is
# stable and budget is approved.
#
# Uses an `eval` GitHub Actions environment so secrets and budget can be
# scoped separately from CI/integration. Configure required reviewers on
# the environment if you want manual triggers to require approval.
# See docs/operations/secrets.md for full operator guidance.

on:
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    name: 5-dimension eval harness (${{ matrix.reasoner }})
    runs-on: ubuntu-latest
    environment: eval
    timeout-minutes: 30

    # One job per reasoner workspace member (reasoners/<name>); each runs the
    # harness with that reasoner's eval adapter.
    strategy:
      fail-fast: false
      matrix:
        reasoner: [account_takeover]

    services:
      # Reasoner infrastructure (mirrors reasoners/account_takeover/compose.yaml).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: decisionledger
          POSTGRES_PASSWORD: decisionledger
          POSTGRES_DB: decisionledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decisionledger -d decisionledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: decisionledger
      POSTGRES_PASSWORD: decisionledger
      POSTGRES_DB: decisionledger
      ATO_REDIS_URL: redis://localhost:6379
      ELASTICSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Initialize Postgres schema
        env:
          PGPASSWORD: decisionledger
        run: |
          psql -h localhost -U decisionledger -d decisionledger \
            -f app/audit/sql/01_init.sql
          psql -h localhost -U decisionledger -d decisionledger \
            -f app/audit/sql/02_tables.sql

      # Index the reasoner's policy corpus and train its model if missing
      # (reasoners/<name>/reasoner.mk).
      - name: Prepare reasoner (policy index + model)
        run: make prepare-${{ matrix.reasoner }}

      - name: Run eval harness
        run: make eval-${{ matrix.reasoner }}

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.reasoner }}-${{ github.run_id }}
          path: outputs/stage/eval/eval-report.json
          if-no-files-found: warn
          retention-days: 30
