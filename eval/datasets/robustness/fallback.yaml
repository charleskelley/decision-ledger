# Robustness sub-check 4 — Fallback behavior correctness.
#
# When an upstream dependency fails (LLM 5xx, retrieval-layer outage,
# corpus-version mismatch), the pipeline must degrade safely. The contract:
# every failure path lands on the conservative HOLD action. Failing open
# (returning ALLOW on dependency error) is the worst-case posture.
#
# Threshold: zero tolerance (1.00).
#
# fallback_kind values supported by PipelineDriver.run_with_forced_fallback:
#   - "llm_5xx"          — LLMClient.complete_structured raises; PolicyGate
#                          catches internally and emits verdict=None;
#                          enforcement Tier 1 routes to HOLD.
#   - "retrieval_error"  — PolicyRetriever.retrieve raises; the driver
#                          translates the raised error into HOLD per the
#                          fallback contract (production code is expected
#                          to grow an explicit catch over time).
#   - "corpus_mismatch"  — pipeline runs with a stale corpus_version label;
#                          documents the contract for future validation.

cases:
  - case_id: fallback-001-llm-5xx-on-gate-call
    event:
      event_id: evt-fallback-001
      timestamp: 2026-04-15T09:05:00Z
      account_id: acct-fallback-001
      session_id: sess_fallback_001
      ip_address: 198.51.100.13
      geolocation:
        latitude: 37.7749
        longitude: -122.4194
        country: US
        city: San Francisco
        asn: AS7922
      device_fingerprint: "fb001a01:fb001b02:fb001c03:fb001d04:fb001e05"
      user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) Safari/605.1.15"
      auth_method: PASSWORD
      outcome: SUCCESS
    fallback_kind: llm_5xx
    expected_action: HOLD

