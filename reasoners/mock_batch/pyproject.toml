[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# mock-batch-reasoner — the daily batch scorer pattern (DR-35)
# =============================================================================
#
# A uv workspace member and one of the reference reasoner patterns: a mock
# that demonstrates the framework's contracts in place, not a product. It
# scores a day's accounts in one pass, records every row a bypass rule covers
# through the ledger's batch endpoint (NDJSON, at most 10,000 lines a
# request), and submits the rows no rule covers, its exceptions, one at a
# time in gate mode, where the rules gate (advisory) decides them. It has no
# service and no infrastructure of its own: its CLI reaches the ledger over
# HTTP, and the ledger registers it by its plugin, by a registration file, or
# by a PUT with the plugin excluded. The framework never depends on it;
# deployment composition lives in the root `reasoners` dependency group.
# Discovery happens through the two entry points below, whose name must equal
# the registration's `reasoner_id`. The rules gate is a dependency because the
# eval driver composes it over the member's own rule set.

[project]
name = "mock-batch-reasoner"
version = "0.1.0"
description = "Reference reasoner pattern for DecisionLedger: a daily batch scorer (mock)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Charles Kelley" },
]
dependencies = [
    "decision-ledger",
    "decisionledger-gate-rules",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0,<7",
]

[project.entry-points."decisionledger.reasoners"]
mock-batch-reasoner = "mock_batch_reasoner.plugin:PLUGIN"

[project.entry-points."decisionledger.eval_adapters"]
mock-batch-reasoner = "mock_batch_reasoner.eval.adapter:ADAPTER"

[project.scripts]
mock-batch-reasoner = "mock_batch_reasoner.__main__:main"

[tool.uv.sources]
decision-ledger = { workspace = true }
decisionledger-gate-rules = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mock_batch_reasoner"]
