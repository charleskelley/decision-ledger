# Docker Compose V2 — no version key (deprecated; omit entirely for Compose V2)
#
# Brings up the framework-owned local stack for DecisionLedger:
#   PostgreSQL 16 — the Decision Bundle audit store, the framework's only
#                  infrastructure. All reasoners share the database; tenant
#                  separation is row-level via `reasoner_id`. The init scripts
#                  are the canonical DDL shipped in app/audit/sql/.
#
# Plugin-owned infrastructure lives in each plugin's own compose file and is
# pulled in with `include:` (Compose >= 2.20):
#   reasoners/account_takeover/compose.yaml — Redis 7 (ATO feature windows,
#                  dedup store, login-event stream).
#   gates/policy_rag/compose.yaml — Elasticsearch 8 (the RAG policy gate's
#                  BM25 index). The gate's dense-retrieval chunks live in this
#                  Postgres, in the gate's own `policy_rag` schema, which the
#                  gate's DDL creates (with the vector extension this image
#                  ships).
#
# M1 Max (ARM64) compatible: all images publish linux/arm64 manifests.
#
# Usage:
#   docker compose up -d        Start all services in background
#   docker compose down         Stop services (volumes preserved)
#   docker compose down -v      Full reset — removes all volumes

include:
  - reasoners/account_takeover/compose.yaml
  - gates/policy_rag/compose.yaml

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Decision Bundle audit store (+ the gates' own schemas)
  # The pgvector image is plain Postgres plus the vector extension, available
  # for a gate's DDL to create; the framework's DDL creates no extension.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisionledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionledger}
      POSTGRES_DB: ${POSTGRES_DB:-decisionledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/audit/sql/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./app/audit/sql/02_tables.sql:/docker-entrypoint-initdb.d/02_tables.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-decisionledger} -d ${POSTGRES_DB:-decisionledger}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
