scenario_id: credential_stuffing_burst
display_name: Credential Stuffing Burst
description: >
  High-velocity attack targeting many distinct accounts from rotating IPs and
  ASNs. Simulates an automated credential stuffing campaign using a leaked
  credential list and rotating proxy infrastructure. Expected to hit the
  high-confidence BLOCK band at the fast scorer without invoking the LLM gate.

expected_actions:
  - BLOCK

generation:
  user_count: 200
  events_per_run: 500

  velocity:
    events_per_minute: 120.0   # 2 events/second — clearly automated
    jitter_factor: 0.05        # Very regular (bot behavior, not human)
    burst_factor: 3.0
    burst_duration_s: 30       # 30-second bursts at 6 events/second

  device:
    fingerprint_count: 50      # Rotating fingerprints to evade device-based detection
    consistency: rotating

  network:
    ip_rotation: high
    asn_rotation: high
    use_known_bad_asn: true    # IPs sourced from synthesized known-bad proxy ASN ranges

  geo:
    mobility: erratic
    impossible_travel: true
    country_count: 15          # Multi-country proxy infrastructure

  auth:
    outcome_weights:
      FAILURE: 0.85
      SUCCESS: 0.12            # ~12% — accounts with reused credentials from breach
      TIMEOUT: 0.03
    method: PASSWORD

notes: >
  The 85% failure rate is the primary credential stuffing signal. In contrast
  to post_breach_ato (high success rate — attacker has valid creds), stuffing
  campaigns produce high failure rates from trying many credentials.
  The 200-user spread, rotating IPs from known-bad ASNs, and multi-country
  geo pattern together create a high-confidence BLOCK signal. The XGBoost
  scorer should route to BLOCK directly — the LLM gate is not invoked.
  Eval dimension 05 (adversarial robustness) includes this scenario.
