name: Docs

# Build the MkDocs site and deploy to GitHub Pages on every push to main
# that touches docs/, mkdocs.yml, or this workflow itself. PRs trigger
# only the build jobs (no deploy) so broken nav / strict-mode failures
# surface during review. An advisory Zensical build runs beside the
# MkDocs one (see docs/development/docs-migration.md).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (mkdocs build --strict)
    runs-on: ubuntu-latest
    # The default reasoners/gates groups pull in torch, sentence-transformers,
    # and xgboost, which a cold uv cache installs slowly — 5 minutes is too
    # tight.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        # mkdocstrings introspects the project modules, so main deps must
        # be present. --no-dev skips pytest and the other dev tools. The
        # `reasoners` and `gates` default groups stay installed, so the
        # workspace member packages (e.g. ato_reasoner) are importable for
        # their reference pages.
        run: uv sync --frozen --group docs --no-dev

      - name: Build site
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  zensical:
    name: Build (zensical build --strict, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tracks whether the site still builds cleanly under Zensical, the
    # maintained successor to MkDocs + Material (see
    # docs/development/docs-migration.md). Advisory only: a failure here
    # never blocks the mkdocs build or the deploy. Zensical is pulled in as
    # an ephemeral, unpinned overlay on the docs group on purpose, so each run
    # tests the current release rather than one frozen in uv.lock.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: uv sync --frozen --group docs --no-dev

      - name: Build site with Zensical
        run: uv run --with zensical zensical build --strict

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
