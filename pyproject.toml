[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "decision-ledger"
version = "0.1.0"
description = "A model-agnostic governed decision framework for AI systems."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Charles Kelley" },
]
keywords = [
    "ai-governance",
    "llm-evaluation",
    "rag",
    "decision-systems",
    "mlops",
    "policy-enforcement",
    "audit-trail",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# =============================================================================
# Dependencies
# =============================================================================

dependencies = [
    # --- Core (schema, contracts, pure logic) ---
    "pydantic>=2.7,<3",
    # --- API layer ---
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # --- Event queue ---
    "redis>=5.0,<6",
    # --- Database ---
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.3,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # --- Search ---
    "elasticsearch>=8.13,<9",
    # --- ML scorer ---
    # shap removed: XGBoost >= 2.0 computes TreeSHAP natively via
    # model.predict(data, pred_contribs=True) — identical numerical output,
    # no llvmlite/numba dependency chain.
    "xgboost>=2.0,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    # --- Embeddings & retrieval ---
    "sentence-transformers>=3.0,<4",
    "torch>=2.3",
    # --- LLM policy gate ---
    "openai>=1.30,<2",
    # --- Serialization & config ---
    "pyyaml>=6.0,<7",
    "orjson>=3.10,<4",
    # --- Observability ---
    "structlog>=24.1,<25",
    "pydantic-settings>=2.13.1",
    "anthropic>=0.97.0",
]

[dependency-groups]
dev = [
    # --- Testing ---
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-xdist>=3.5,<4",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",              # FastAPI test client
    # --- Linting & formatting ---
    "ruff>=0.5,<1",
    "sqlfluff>=3.1,<4",
    # --- Type checking ---
    "pyright>=1.1.370,<2",
    # --- Evaluation ---
    "ragas>=0.1.10,<1",
    # --- Utilities ---
    "ipython>=8.25,<9",
    "rich>=13.7,<14",              # Pretty CLI output
    "pandas-stubs>=3.0.0.260204",
]
docs = [
    # --- Documentation ---
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    # --- API reference (mkdocstrings, one page per top-level package) ---
    "mkdocstrings[python]>=0.27,<1",
    "griffe-pydantic>=1.0,<2",
    # mkdocstrings auto-formats rendered signatures with ruff if present.
    # Listed here so CI's --no-dev install still picks it up.
    "ruff>=0.5,<1",
]

[project.urls]
Repository = "https://github.com/charleskelley/decision-ledger"
Documentation = "https://charleskelley.github.io/decision-ledger/"
Issues = "https://github.com/charleskelley/decision-ledger/issues"

# =============================================================================
# Entry Points
# =============================================================================

# =============================================================================
# Hatch (build configuration)
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["core", "app", "eval", "generator", "reasoner"]

# =============================================================================
# Ruff — single tool for formatting and linting
# See STYLE.md for conventions. No black, no isort, no flake8, no pylint.
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["core", "app", "eval", "generator", "reasoner"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "C4",     # flake8-comprehensions
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "PIE",    # flake8-pie
]
ignore = [
    "D100",   # missing docstring in public module (too noisy early on)
    "D104",   # missing docstring in public package
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "S101",   # assert used (fine in tests)
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic models require runtime imports — do not move to TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"docs/**/*.py" = [
    "E501",   # PlantUML directive strings cannot be wrapped
]
"tests/**/*.py" = [
    "D",      # no docstring requirements in tests
    "S101",   # assert is expected in tests
    "S105",   # hardcoded passwords in test fixtures are fine
    "S106",   # hardcoded passwords in test fixtures are fine
]
"generator/**/*.py" = [
    "S311",   # pseudo-random generators are fine for synthetic data
    "S105",   # "hardcoded password" false positives on enum values like AuthMethod.PASSWORD
    "S106",   # hardcoded password arguments — expected in synthetic data generation
]
"core/**/*.py" = [
    "S105",   # "hardcoded password" false positives on enum values like AuthMethod.PASSWORD
]
"reasoner/**/*.py" = [
    "S105",   # "hardcoded password" false positives on enum values like AuthMethod.PASSWORD
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["core", "app", "eval", "generator", "reasoner"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

# =============================================================================
# Pyright — type checking
# =============================================================================

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["core", "app", "eval", "generator", "reasoner"]
exclude = ["**/__pycache__", "build", "dist", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = true

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = [
    "-ra",                         # show summary of all non-passing tests
    "--strict-markers",            # fail on unknown markers
    "--strict-config",             # fail on config errors
    "-q",                          # quiet output by default
]
markers = [
    "integration: requires Docker services (Redis, PostgreSQL, Elasticsearch)",
    "evaluation: full evaluation harness tests (slow, LLM calls, costs money)",
    "slow: tests that take >10s for reasons other than integration or eval",
    "smoke: minimal end-to-end sanity check (subset of integration, fast)",
]
filterwarnings = [
    "ignore::DeprecationWarning:sentence_transformers.*",
    "ignore::DeprecationWarning:torch.*",
]
asyncio_mode = "auto"

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["core", "app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "@overload",
]

# =============================================================================
# SQLFluff — SQL linting and formatting
# Dialect: postgres (matches docker-compose.yml PostgreSQL 16 service)
# =============================================================================

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
sql_file_exts = ".sql,.pgsql"
max_line_length = 88              # Consistent with ruff line-length

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"   # Consistent with infra/postgres/init.sql style

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.types]
capitalisation_policy = "lower"
