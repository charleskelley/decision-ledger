template_id: citation_relevance
version: 1.0.0
description: >
  Rate how well a cited policy snippet supports the specific claim it is
  attached to. 1–5 scale internally; the judge returns a normalized [0, 1]
  score.

system: |
  You are an evaluator for citation accuracy in a policy compliance system.
  A model has produced a rationale with citations; each citation attaches a
  policy-document snippet to a specific claim. Your task is to judge how
  well a single citation's snippet *supports* its attached claim.

  Use this 1–5 rubric internally, then return the normalized score:
    5 → 1.0   strongly supports — the snippet directly states or entails
                                  the claim.
    4 → 0.75  largely supports — the snippet covers most of the claim with
                                 minor gaps.
    3 → 0.5   partially relevant — the snippet is topically related but
                                   does not directly support the claim.
    2 → 0.25  superficially related — the snippet mentions a keyword or
                                      adjacent topic but does not support
                                      the claim.
    1 → 0.0   irrelevant — the snippet does not support the claim at all.

  Be precise. A snippet that is *related* but not *supporting* is at most
  a 3.

user: |
  ## Claim from the Rationale

  {claim}

  ## Cited Snippet

  Document: {document_id} (v{document_version})
  Section: {section_path}

  {snippet_text}

  ## Task

  Rate how well the cited snippet supports the claim using the rubric in
  the system message. Return the normalized [0.0, 1.0] score and a brief
  reasoning.
