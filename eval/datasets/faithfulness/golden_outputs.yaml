cases:
- case_id: f-cap-device_fingerprint_anomaly
  rationale: Given the device consistency score of 0.05 with the high risk score,
    ambiguous device novelty, and sparse account history, a HOLD is required as per
    Section 5 of the Device Fingerprint Anomaly Response, which requires human review
    when the score is under 0.35 even without corroborating signals. This action is
    supported to ensure thorough risk assessment of ambiguous conditions.
  contexts:
  - 'An ambiguous device consistency score indicates a partial fingerprint match.
    Legitimate

    causes include a browser update, OS upgrade, new monitor, or the same user accessing

    from a second owned device with similar but not identical configuration.


    When `device_consistency_score` is in [0.35, 0.69] AND no corroborating attack
    signals

    are present, the required action is **CHALLENGE**. Corroborating attack signals
    include:

    impossible travel (INT-GEO-RISK-V1 §3), velocity anomaly (INT-VELOCITY-V1 §3),
    known-bad

    ASN (INT-VELOCITY-V1 §4), or failure rate above 40%.


    When `device_consistency_score` is in [0.35, 0.69] AND one or more corroborating
    attack

    signals are present, the required action escalates to **HOLD**, pending human
    review of

    the combined signal pattern.


    A CHALLENGE for ambiguous device consistency requires the account holder to complete

    step-up authentication. The specific step-up method is determined by INT-MFA-REQ-V2.

    Successful step-up re-establishes device trust and updates the fingerprint baseline
    for

    that account.'
  - 'A FIDO2 credential is created during registration and bound to:


    - A specific relying party (the authentication service).

    - A specific authenticator (hardware security key or platform authenticator).

    - A specific user account at the relying party.


    The binding to a specific authenticator is the critical property for device risk

    assessment. Unlike password-based authentication, where the credential can be
    used

    from any device, a FIDO2 credential can only be used from the registered authenticator.


    **Device consistency implications**: For accounts using FIDO2 authentication,
    the

    device fingerprint consistency signal has a different interpretation than for
    password

    or TOTP accounts. A FIDO2 authentication from an unrecognised device fingerprint

    indicates credential migration (the authenticator was moved to a new device) rather

    than a new device accessing an existing credential. Credential migration requires

    explicit re-registration and should be treated with the same caution as a new
    device

    in other authentication contexts.'
  - 'An unknown device score indicates that the login originates from a device that
    does not

    match the account''s established fingerprint in any meaningful way. Legitimate
    causes

    include account access from a public terminal, a new device, or complete hardware

    replacement.


    When `device_consistency_score` is below 0.35 AND no corroborating attack signals
    are

    present, the required action is **HOLD**. A new device without corroboration warrants

    human review before permitting access.


    When `device_consistency_score` is below 0.35 AND corroborating signals are present

    (impossible travel, high failure rate, velocity spike, or known-bad ASN), the
    required

    action escalates to **BLOCK** per INT-AUTH-RISK-V2 §4.4.


    The unknown device threshold of 0.35 acknowledges that geolocation imprecision
    and

    clock skew may cause timezone component mismatches that reduce scores by up to
    0.20.

    The threshold is therefore not set at 0.0.'
  - 'Device fingerprint signals are evaluated in combination with geographic signals

    (INT-GEO-RISK-V1) and velocity signals (INT-VELOCITY-V1). The combination of unknown

    device + impossible travel + high failure rate constitutes the post-breach ATO
    signature

    in INT-ATO-DETECT-V2 §3.


    The device fingerprint signal alone — absent corroborating signals — should not
    produce

    BLOCK. Proportionate response to device anomaly is CHALLENGE for ambiguous scores
    and

    HOLD for unknown scores.'
  - "CHALLENGE is appropriate when an isolated anomalous signal is present that is\n\
    insufficient for HOLD or BLOCK, and proportionate friction is warranted:\n\n-\
    \ Device consistency score in [0.35, 0.70] with no corroborating attack signals\n\
    \  (INT-DEVICE-FP-V1 §4).\n- Novel entity with clean signals and no corroborating\
    \ risk indicators\n  (INT-NOVEL-ENTITY-V1 §4.2).\n- First login from a new country\
    \ with no velocity or device anomalies.\n- SSO client with no established behavioral\
    \ baseline (INT-ENT-AUTH-V1 §3.2)."
  cited_snippets:
  - When `device_consistency_score` is below 0.35 AND no corroborating attack signals
    are present, the required action is **HOLD**.
