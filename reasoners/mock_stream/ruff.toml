# Member-local Ruff config: inherits everything from the root pyproject and
# only adds the stream mock's first-party name and per-file ignores.
extend = "../../pyproject.toml"
src = ["src", "tests", "../.."]

[lint.isort]
known-first-party = ["core", "app", "eval", "mock_stream_reasoner"]

[lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "D",      # no docstring requirements in tests
    "S101",   # assert is expected in tests
    "S105",   # hardcoded keys in test fixtures are fine
    "S106",   # hardcoded keys in test fixtures are fine
]
"src/mock_stream_reasoner/__main__.py" = [
    "T201",   # the CLI prints to stdout
]
"src/mock_stream_reasoner/replay.py" = [
    "S311",   # pseudo-random generators are fine for a synthetic stream
]
