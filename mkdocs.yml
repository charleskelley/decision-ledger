site_name: DecisionLedger
docs_dir: docs
site_description: A model-agnostic governed decision framework for AI systems.
site_url: https://charleskelley.github.io/decision-ledger
repo_url: https://github.com/charleskelley/decision-ledger
repo_name: charleskelley/decision-ledger
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  font:
    text: Outfit
    code: JetBrains Mono

  palette:
    # Light mode — triggered by OS preference, togglable manually
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode — triggered by OS preference, togglable manually
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - stylesheets/color-swatches.js

nav:
  - Home: index.md
  - Design:
    - Overview: design/index.md
    - Architecture: design/architecture.md
    - Pipeline: design/pipeline.md
    - Interfaces: design/core.md
    - Infrastructure: design/infrastructure.md
    - Gates:
      - design/gates/index.md
      - Implementation: design/gates/implementation.md
      - Policy:
        - design/gates/policy/index.md
        - Corpus: design/gates/policy/policy-corpus.md
    - Reasoners:
      - design/reasoners/index.md
      - Handoff: design/reasoners/reasoner-handoff.md
      - Account Takeover:
        - Overview: design/reasoners/account-takeover/account-takeover.md
        - Data Model: design/reasoners/account-takeover/data.md
        - Scenarios: design/reasoners/account-takeover/scenarios.md
    - Evaluation: design/evaluation.md
    - Decisions: design/decisions.md
  - Reference:
    - reference/index.md
    - core: reference/core.md
    - app: reference/app.md
    - reasoner: reference/reasoner.md
    - eval: reference/eval.md
    - generator: reference/generator.md
    - tools: reference/tools.md
  - Operations:
    - Secrets: operations/secrets.md
  - Development:
    - Contributing: development/contributing.md
    - Style Guide: development/style.md
    - Local Runbook: development/runbook-local.md

not_in_nav: |
  development/design-palette.md
  development/docs-migration.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      custom_templates: overrides
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            docstring_section_style: list
            members_order: source
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_submodules: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            filters: ["!^_"]
            extensions:
              - griffe_pydantic
