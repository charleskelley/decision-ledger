# Consistency scenarios for the batch mock.
#
# A batch scores each row on its own (mock_batch_reasoner/scorer.py), so the
# order of a day's rows never changes a decision. These scenarios pin that
# property through the whole pipeline: the scorer, the assembler, the batch
# request (the day's records), gate-mode submit (its exceptions), the rules
# gate over the member's rule set (mock-batch-v1), and the ledger. Each
# ordering is one day the driver runs from fresh state; its last row is the
# trigger. No model is called.
#
# Expected stable actions: ALLOW (a current account, recorded under
# current-account) and HOLD (a flagged account 60 days past due, an
# exception the rules gate holds: flagged-delinquent and flagged-past-due
# match).

scenarios:
  - scenario_id: mb-current-account
    description: >
      A current account at a quarter of its limit, reviewed in a day with a
      watch-list account, an account headed for charge-off, and a flagged
      account: recorded ALLOW under current-account in every ordering.
    orderings:
      - ordering_id: extract-order
        events:
          - &current_1 {event_id: row-mb-current-1, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-current-1, balance: 850.0, credit_limit: 1000.0, days_past_due: 30, returned_payments: 0, needs_review: false}
          - &current_2 {event_id: row-mb-current-2, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-current-2, balance: 6000.0, credit_limit: 5000.0, days_past_due: 120, returned_payments: 2, needs_review: false}
          - &current_3 {event_id: row-mb-current-3, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-current-3, balance: 200.0, credit_limit: 2500.0, days_past_due: 0, returned_payments: 0, needs_review: true}
          - &current_t {event_id: row-mb-current-trigger, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-current-t, balance: 250.0, credit_limit: 1000.0, days_past_due: 0, returned_payments: 0, needs_review: false}
      - ordering_id: reversed-precursors
        events: [*current_3, *current_2, *current_1, *current_t]

  - scenario_id: mb-flagged-account
    description: >
      An account flagged for review, 60 days past due at 90% of its limit,
      reviewed in a day with a current account, a delinquent one, and another
      flagged account: no bypass rule covers it, so the rules gate decides
      it, and holds it in every ordering.
    orderings:
      - ordering_id: extract-order
        events:
          - &flagged_1 {event_id: row-mb-flagged-1, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-flagged-1, balance: 100.0, credit_limit: 500.0, days_past_due: 0, returned_payments: 0, needs_review: false}
          - &flagged_2 {event_id: row-mb-flagged-2, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-flagged-2, balance: 9500.0, credit_limit: 10000.0, days_past_due: 60, returned_payments: 0, needs_review: false}
          - &flagged_3 {event_id: row-mb-flagged-3, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-flagged-3, balance: 1000.0, credit_limit: 1000.0, days_past_due: 30, returned_payments: 0, needs_review: true}
          - &flagged_t {event_id: row-mb-flagged-trigger, as_of: "2026-09-01T23:59:59Z", account_id: acct-mb-flagged-t, balance: 4500.0, credit_limit: 5000.0, days_past_due: 60, returned_payments: 0, needs_review: true}
      - ordering_id: reversed-precursors
        events: [*flagged_3, *flagged_2, *flagged_1, *flagged_t]
