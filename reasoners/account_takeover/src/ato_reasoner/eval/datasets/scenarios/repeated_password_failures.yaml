# Consistency scenario — repeated password failures from same source.
#
# 5 PASSWORD/FAILURE events from the same account, same IP, same device.
# The pattern is stable — same source, same outcome — and any order
# produces the same evidence to the gate. The trigger's decision should
# be order-invariant.
#
# Expected stable action: a non-ALLOW conservative action (BLOCK or
# CHALLENGE). The exact action depends on gate calibration; the
# consistency invariant is that whichever action lands, it lands on every
# ordering.

scenarios:
  - scenario_id: cs-repeated-failures
    description: >
      Five password failures from a single account, single IP, single
      device. Same evidence regardless of order — the trigger's decision
      should not change with permutation of the precursors.
    orderings:
      - ordering_id: chronological
        events:
          - &cs_fail_e1
            event_id: evt-cs-fail-e1
            timestamp: 2026-04-19T22:00:00Z
            account_id: acct-cs-fail-001
            session_id: sess_cs_fail_e1
            ip_address: 198.51.100.99
            geolocation: &cs_fail_geo_chi
              latitude: 41.8781
              longitude: -87.6298
              country: US
              city: Chicago
              asn: AS6939
            device_fingerprint: &cs_fail_device "fl0001a:fl0001b:fl0001c:fl0001d:fl0001e"
            user_agent: &cs_fail_ua "Mozilla/5.0 (X11; Linux x86_64) Firefox/124.0"
            auth_method: PASSWORD
            outcome: FAILURE
          - &cs_fail_e2
            event_id: evt-cs-fail-e2
            timestamp: 2026-04-19T22:01:30Z
            account_id: acct-cs-fail-001
            session_id: sess_cs_fail_e2
            ip_address: 198.51.100.99
            geolocation: *cs_fail_geo_chi
            device_fingerprint: *cs_fail_device
            user_agent: *cs_fail_ua
            auth_method: PASSWORD
            outcome: FAILURE
          - &cs_fail_e3
            event_id: evt-cs-fail-e3
            timestamp: 2026-04-19T22:02:45Z
            account_id: acct-cs-fail-001
            session_id: sess_cs_fail_e3
            ip_address: 198.51.100.99
            geolocation: *cs_fail_geo_chi
            device_fingerprint: *cs_fail_device
            user_agent: *cs_fail_ua
            auth_method: PASSWORD
            outcome: FAILURE
          - &cs_fail_e4
            event_id: evt-cs-fail-e4
            timestamp: 2026-04-19T22:04:10Z
            account_id: acct-cs-fail-001
            session_id: sess_cs_fail_e4
            ip_address: 198.51.100.99
            geolocation: *cs_fail_geo_chi
            device_fingerprint: *cs_fail_device
            user_agent: *cs_fail_ua
            auth_method: PASSWORD
            outcome: FAILURE
          - &cs_fail_trigger
            event_id: evt-cs-fail-trigger
            timestamp: 2026-04-19T22:05:30Z
            account_id: acct-cs-fail-001
            session_id: sess_cs_fail_trigger
            ip_address: 198.51.100.99
            geolocation: *cs_fail_geo_chi
            device_fingerprint: *cs_fail_device
            user_agent: *cs_fail_ua
            auth_method: PASSWORD
            outcome: FAILURE
      - ordering_id: reversed-precursors
        events:
          - *cs_fail_e4
          - *cs_fail_e3
          - *cs_fail_e2
          - *cs_fail_e1
          - *cs_fail_trigger
      - ordering_id: shuffled
        events:
          - *cs_fail_e3
          - *cs_fail_e1
          - *cs_fail_e4
          - *cs_fail_e2
          - *cs_fail_trigger
