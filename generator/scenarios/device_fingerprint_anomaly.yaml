scenario_id: device_fingerprint_anomaly
display_name: Device Fingerprint Anomaly with Mild Corroborating Signal
description: >
  Partial device fingerprint match (browser update / OS upgrade / desktop↔laptop
  switch) combined with a low-rotation IP pool and a modest velocity uplift.
  The device_consistency_score falls into the ambiguous zone (~0.5), and the
  IP/velocity signals add just enough corroborating evidence to push the
  scorer into the routing band (0.20–0.85) rather than fast-pathing.
  Expected: CHALLENGE (step-up MFA).

expected_actions:
  - CHALLENGE
  - HOLD

generation:
  user_count: 2
  events_per_run: 30

  velocity:
    events_per_minute: 2.0
    jitter_factor: 0.3

  device:
    fingerprint_count: 2
    consistency: partial
    partial_match_score: 0.52  # Forces device_consistency_score into the ambiguous zone

  network:
    ip_rotation: low
    asn_rotation: none

  geo:
    mobility: static
    impossible_travel: false
    country_count: 1

  auth:
    outcome_weights:
      SUCCESS: 0.85
      FAILURE: 0.15
    method: PASSWORD

notes: >
  This scenario is calibrated to land the trigger event in the scorer's routing
  band so the LLM policy gate fires end-to-end. Three signals combine:

  - partial_match_score=0.52 → device_consistency_score in the ambiguous zone
  - ip_rotation=low → modest ip_novelty across the run
  - events_per_minute=2.0 → mild velocity_1min uplift (~2)

  The mix mirrors a borderline-risk login the gate is designed to adjudicate:
  device anomaly present (requires MFA per NIST 800-63B AAL2), corroborated by
  a fresh IP and slight velocity, but no clear attack signature → CHALLENGE is
  the proportionate response. Citations should reference NIST 800-63B §5.1.3
  (MFA required when device confidence falls below threshold).

  This scenario distinguishes "ambiguous device + light corroboration"
  (CHALLENGE) from "clearly new device + new geo + velocity spike" (HOLD/BLOCK
  as in post_breach_ato). It is also the MVP's committed proof point that the
  hybrid scorer + LLM gate path works end-to-end against the live stack —
  `tests/integration/test_scenario_smoke.py` hard-asserts a non-null
  rationale (i.e., the gate fired) for this scenario.

  HOLD is included in expected_actions because the DR-21 enforcement tier
  for novel entities (tier3_novel_entity) escalates the gate's CHALLENGE to
  HOLD when the account has sparse history. With the deterministic seed
  used in the smoke test, the trigger event hits the novel-entity tier
  before the warmup events have built enough history to clear it.
