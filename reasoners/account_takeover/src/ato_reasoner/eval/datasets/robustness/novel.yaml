# Robustness sub-check 3 — Novel-pattern action accuracy.
#
# Adversarial or low-data patterns outside the scorer's training distribution
# must route to a *conservative* action (HOLD or BLOCK), never ALLOW. The
# enforcement Tier 3 (novel_entity / sparse_history) is a major contributor;
# Tier 2 (adversarial probe) and Tier 4 (low confidence + high-risk action)
# also catch novelty.
#
# Threshold: 0.90 (allows minor noise in the gate's confidence assignment;
# the safety guarantee is "no novel pattern routes to ALLOW," not exact
# bucketing into HOLD vs BLOCK).
#
# Priming events: each case drives 2 baseline events with the same
# account_id before the trigger event. Without priming, the trigger is a
# first-event-of-account and the FeatureService produces neutral novelty
# signals (=0.5) — the scorer outputs ~0.0 and the event fast-paths to
# ALLOW, bypassing the enforcement tiers we're testing. With priming, the
# trigger introduces real novelty (new IP/device/geo against the
# established baseline) and the score elevates into the routing band.

cases:
  - case_id: novel-001-sparse-account-sso-new-region
    priming_events:
      # Established US baseline — same account, two prior events from one
      # device/IP/region. Each fast-paths to ALLOW (no LLM cost) but
      # writes feature history to Redis.
      - event_id: evt-novel-001-prime-1
        timestamp: 2026-04-13T10:00:00Z
        account_id: acct-novel-001-just-created
        session_id: sess_novel_001_p1
        ip_address: 73.158.42.10
        geolocation:
          latitude: 37.7749
          longitude: -122.4194
          country: US
          city: San Francisco
          asn: AS7922
        device_fingerprint: "novel001home:novel001home:novel001home:novel001home:novel001home"
        user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) Safari/605.1.15"
        auth_method: SSO
        outcome: SUCCESS
      - event_id: evt-novel-001-prime-2
        timestamp: 2026-04-13T18:30:00Z
        account_id: acct-novel-001-just-created
        session_id: sess_novel_001_p2
        ip_address: 73.158.42.10
        geolocation:
          latitude: 37.7749
          longitude: -122.4194
          country: US
          city: San Francisco
          asn: AS7922
        device_fingerprint: "novel001home:novel001home:novel001home:novel001home:novel001home"
        user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) Safari/605.1.15"
        auth_method: SSO
        outcome: SUCCESS
    event:
      event_id: evt-novel-001
      timestamp: 2026-04-14T08:14:00Z
      account_id: acct-novel-001-just-created
      session_id: sess_novel_001
      ip_address: 198.51.100.123
      geolocation:
        latitude: -33.8688
        longitude: 151.2093
        country: AU
        city: Sydney
        asn: AS4804
      device_fingerprint: "novel001a:novel001b:novel001c:novel001d:novel001e"
      user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) Safari/605.1.15"
      auth_method: SSO
      outcome: SUCCESS
    description: >
      US-baseline account suddenly attempts SSO from Sydney AU on a
      never-seen device. Triple-novel signal (new IP + new device +
      new country) elevates the scorer into the gate-routing band;
      enforcement should land conservatively.

