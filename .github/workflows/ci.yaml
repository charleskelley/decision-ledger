name: CI

# Static analysis + unit tests + DR-23 boundary check on every push and PR.
# No Docker, no LLM provider secrets — runs successfully on forks.
# Target: under 60 seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint, typecheck, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Default groups (dev + reasoners + gates) install every workspace member.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      # The framework's DDL plus every gate's own (gates/<name>/src/<pkg>/sql).
      - name: SQLFluff lint (postgres dialect)
        run: uv run sqlfluff lint --dialect postgres app/audit/sql/ gates/*/src/*/sql/

      - name: Pyright typecheck
        run: uv run pyright

      - name: Unit tests (no integration, eval, slow, or smoke)
        run: >
          uv run pytest
          -m "not integration and not evaluation and not slow and not smoke"
          --maxfail=5

  boundary:
    name: Boundary (DR-23 SDK-import integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      # DR-23: only the RAG policy gate's LLM adapters
      # (gates/policy_rag/src/policy_rag_gate/llm/) may import an LLM SDK.
      # Any other file with `from openai` / `import anthropic`, at any
      # indentation, is an architectural regression — fail the build
      # immediately. tests/test_framework_boundary.py checks the same rule
      # with an AST scan inside `make check`.
      - name: Check no SDK imports outside the policy gate's LLM adapters
        run: |
          set -euo pipefail
          allowed="gates/policy_rag/src/policy_rag_gate/llm/"
          leaks=$(grep -rE "^[[:space:]]*(from|import)[[:space:]]+(openai|anthropic)([[:space:].]|$)" \
            --include="*.py" \
            app/ core/ eval/ reasoners/ gates/ tests/ \
            | grep -v "^${allowed}" || true)
          if [ -n "$leaks" ]; then
            echo "ERROR: DR-23 boundary violation — LLM SDK imported outside ${allowed}:"
            echo "$leaks"
            exit 1
          fi
          echo "OK: no SDK imports outside ${allowed}"
