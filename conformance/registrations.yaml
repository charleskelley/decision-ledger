# The example reasoner's registration, for a DecisionLedger instance that does
# not install the example reasoner's plugin. Point the instance at it:
#
#   DECISIONLEDGER_REGISTRATIONS=conformance/registrations.yaml
#
# or send the entry as JSON with the operator key:
# PUT /api/v1/reasoners/example-reasoner. An instance that installs the plugin
# (a default `uv sync` of this repository) registers it already; registering
# it here or over HTTP too refuses startup or the write (one source per
# reasoner). The shape of each entry is a ReasonerRegistration as JSON
# (schemas: GET /api/v1/reasoners). An instance that composes the RAG policy
# gate needs the example's prompts and corpus under its asset root
# (POLICY_RAG_GATE_ASSETS_ROOT/example-reasoner/) and the corpus loaded as
# example-policy, the corpus the binding below names (DR-34; see README.md).
registrations:
- reasoner_id: example-reasoner
  reasoner_name: Example Reasoner
  gates:
  - gate_id: policy
    mandatory: false
    config:
      corpora:
      - corpus_id: example-policy
        provider: reference
        tier: 1
        min_provenance: pinned_version
      k_per_corpus: 5
  bypass_rules:
  - rule_id: low-score
    version: '1'
    description: 'widget_score below 0.2: the widget is steady and aligned; record
      ALLOW without the policy gate'
    predicate:
      kind: compare
      field: label_value
      op: lt
      value: 0.2
    action: ALLOW
  - rule_id: high-score
    version: '1'
    description: 'widget_score above 0.9: the widget is shaking apart; record BLOCK
      without the policy gate'
    predicate:
      kind: compare
      field: label_value
      op: gt
      value: 0.9
    action: BLOCK
  recordable_actions:
  - ALLOW
  - BLOCK
  native_namespaces:
  - native_namespace: example-widget
    namespace_uuid: 8b4f2a6e-1c3d-5e7f-9a0b-2c4d6e8f0a1b
    entity_type: widget
  novel_entity_feature: thin_history
  jurisdiction_conflict_groups:
  - - REGION_A
  - - REGION_B
