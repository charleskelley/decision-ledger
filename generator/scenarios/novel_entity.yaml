scenario_id: novel_entity
display_name: Novel Entity
description: >
  New accounts with sparse event history — fewer than the minimum events needed
  to establish a reliable behavioral baseline. No anomalous signals other than
  sparse history: clean device, stable geography, known ISP, normal velocity,
  high success rate. Tests the enforcement layer's novel-entity routing trigger,
  which routes to HOLD regardless of the scorer's risk score. Expected: HOLD
  or CHALLENGE depending on policy configuration.

expected_actions:
  - CHALLENGE
  - HOLD

generation:
  user_count: 10           # Many new users (simulates account creation wave)
  events_per_run: 15       # Intentionally sparse — ~1.5 events per user
  novel_entity: true       # Sets sparse_history=True in FeatureVector

  velocity:
    events_per_minute: 0.3   # Normal, even a bit conservative
    jitter_factor: 0.4

  device:
    fingerprint_count: 1
    consistency: stable      # New account, but clean device

  network:
    ip_rotation: none
    asn_rotation: none

  geo:
    mobility: static
    impossible_travel: false
    country_count: 1

  auth:
    outcome_weights:
      SUCCESS: 0.90
      FAILURE: 0.10
    method: PASSWORD

notes: >
  The enforcement layer has an explicit novel-entity trigger (see app/enforcement/):
  if feature_vector.sparse_history is True, route to HOLD with review packet.
  This trigger fires regardless of risk_score — a new entity with a perfect
  clean profile still triggers HOLD because the system has insufficient data
  to trust its own signals.

  CHALLENGE is acceptable if the policy configuration uses a lighter touch
  for novel entities with clean signals (INTERNAL-RISK-v2.1 §3.1 allows
  CHALLENGE for novel entities with no corroborating risk signals, while
  the default enforcement rule is HOLD).

  This scenario tests enforcement rule priority: the novel-entity rule should
  take precedence over a low risk_score that would otherwise route to ALLOW.
  The override_log in the DecisionBundle must record which rule fired.
